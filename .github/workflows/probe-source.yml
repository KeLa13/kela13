name: Diagnose update export

on:
  push:
    branches: [master]
    paths: [.github/workflows/probe-source.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record export availability
        run: |
          python - <<'PY'
          import base64,json,re,urllib.error,urllib.request
          from scripts.sync_github_updates import GitHubAPI,SOURCE_ORIGIN
          rows=[]
          for channel in ('stable','beta'):
              for named in (False,True):
                  request=urllib.request.Request(SOURCE_ORIGIN+'/github-updates/'+channel,headers={'User-Agent':'Xyeta-Mirror-Sync'} if named else {})
                  try:
                      response=urllib.request.urlopen(request,timeout=30)
                  except urllib.error.HTTPError as error:
                      response=error
                  except urllib.error.URLError as error:
                      rows.append({'channel':channel,'named_agent':named,'error_type':type(error).__name__})
                      continue
                  with response:
                      raw=response.read(16384)
                      row={'channel':channel,'named_agent':named,'status':response.status,'content_type':response.headers.get('Content-Type'),'server':response.headers.get('Server')}
                  try:
                      value=json.loads(raw)
                      row.update(error=value.get('error'),version=value.get('manifest',{}).get('version'),manifest_channel=value.get('manifest',{}).get('channel'))
                  except ValueError:
                      match=re.search(r'<title>(.*?)</title>',raw.decode('utf-8',errors='replace'),re.I)
                      row['title']=match.group(1)[:200] if match else None
                  rows.append(row)
          api=GitHubAPI(__import__('os').environ['GH_TOKEN'])
          current=api.request('GET','contents/source-status.json',missing_ok=True)
          payload={'message':'Record distribution diagnostics','content':base64.b64encode(json.dumps(rows,indent=2).encode()).decode(),'branch':'master'}
          if current: payload['sha']=current['sha']
          api.request('PUT','contents/source-status.json',payload)
          print(json.dumps(rows,indent=2))
          PY
